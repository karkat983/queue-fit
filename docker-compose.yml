# Target service: httpbin (open source) under gunicorn with SYNC workers.
# A sync worker serves one request at a time, so the number of workers is the
# true server count c that the M/M/c fit should recover.
services:
  httpbin:
    build: ./service
    image: queue-fit/httpbin:0.10.2
    environment:
      WORKERS: ${WORKERS:-4}
    ports:
      - "8080:80"
